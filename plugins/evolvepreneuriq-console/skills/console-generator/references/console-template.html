<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Evolvepreneur®iQ Workplace</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;height:100vh;overflow:hidden}
:root{--bg:#eef0f5;--panel:#fff;--panel2:#f6f7fb;--hover:#f2eefe;--line:#e5e8f0;--ink:#1b2233;--muted:#6b7488;--faint:#9aa3b5;--text2:#5a6478;--text3:#3a4256;--accent:#6d28d9;--accent2:#e0189e;--g:#16a34a;--code:#0f1420;--codeink:#dfe6f2}html[data-theme="dark"]{--bg:#0f1420;--panel:#191f2e;--panel2:#222b3d;--hover:#262042;--line:#2a3346;--ink:#e8edf6;--muted:#9aa5ba;--faint:#697488;--text2:#aeb8cc;--text3:#c7d0e0;--g:#34d399;--code:#0a0e16;--codeink:#dfe6f2}
/* top bar */
.topbar{height:52px;flex:0 0 52px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 16px;gap:16px}
.tl{display:flex;align-items:center;gap:12px}.burger{color:var(--faint);font-size:18px}
.brand{display:flex;align-items:center;gap:9px;font-size:15px}
.blogo{width:28px;height:28px;border-radius:8px;overflow:hidden;display:block;flex:0 0 auto}
.tnav{display:flex;gap:20px;color:var(--text2);font-size:13px}.tnav span:hover{color:var(--accent);cursor:default}
.tr{display:flex;align-items:center;gap:12px}
.tenant{font-size:13px;color:var(--text3);border:1px solid var(--line);border-radius:8px;padding:5px 11px;cursor:pointer}
.tr{position:relative}
.bizmenu{position:absolute;top:40px;right:38px;background:var(--panel);border:1px solid var(--line);border-radius:11px;box-shadow:0 14px 38px rgba(20,26,45,.2);padding:5px;min-width:200px;z-index:45}
.bizitem{padding:8px 11px;border-radius:7px;font-size:13px;color:var(--text3);cursor:pointer}
.bizitem:hover{background:var(--hover)}
.bizitem.on{color:var(--accent);font-weight:700}
.bizhint{padding:8px 11px;font-size:11px;color:var(--faint);line-height:1.4;border-top:1px solid var(--line);margin-top:3px}
.avatar{width:28px;height:28px;border-radius:50%;background:#6d28d9;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:0 0 auto}
/* main */
.main{flex:1;display:flex;min-height:0}
.left{width:430px;flex:0 0 430px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.asst{display:flex;align-items:center;gap:11px;padding:14px 16px;border-bottom:1px solid var(--line)}
.aavatar{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#efe9ff,#fbe9f6);display:flex;align-items:center;justify-content:center;color:#6d28d9;font-size:17px;flex:0 0 auto}
.aname{font-weight:700;font-size:14px}.reg{font-size:.62em;vertical-align:super;font-weight:600;opacity:.85}.arole{font-size:12px;color:var(--muted)}
.status{margin-left:auto;font-size:11.5px;color:var(--g);font-weight:600}
.tabs{display:flex;gap:4px;padding:10px 12px 0}
.tab{flex:1;border:0;background:transparent;color:var(--muted);font-size:12px;font-weight:600;padding:8px 6px;border-radius:8px;cursor:pointer;border-bottom:2px solid transparent}
.tab:hover{color:var(--ink)}.tab.on{color:var(--accent);border-bottom-color:var(--accent);background:#f7f4ff}
.lsearch{padding:10px 12px}
.lsearch input{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 12px;font-size:13px;outline:none;background:var(--panel2)}
.lsearch input:focus{border-color:var(--accent);background:var(--panel)}
.menu{overflow:auto;padding:2px 10px 16px;flex:1}
.sec{margin-bottom:2px}
.sechead{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:9px;cursor:pointer}
.sechead:hover{background:#f5f6fa}
.chev{width:12px;color:var(--faint);font-size:10px;display:inline-flex;justify-content:center}
.secico{display:inline-flex}.secico svg{width:16px;height:16px}
.secname{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#4a5468}
.seccount{margin-left:auto;font-size:11px;color:var(--faint);font-weight:600}
.mrow{display:flex;align-items:center;gap:10px;padding:7px 12px 7px 30px;border-radius:8px;cursor:pointer}
.mrow:hover{background:var(--hover)}
.mdot{width:7px;height:7px;border-radius:50%}
.mtitle{font-size:13px;font-weight:500}
.rw{margin-left:auto;font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;padding:2px 6px;border-radius:5px;flex:0 0 auto}
.rw-read{background:#eef1f6;color:#647089}
.rw-draft{background:#fef3c7;color:#b45309}
.rw-write{background:#dcfce7;color:#15803d}
.menucap{font-size:11.5px;color:var(--muted);padding:2px 12px 10px;display:flex;align-items:center;gap:5px;flex-wrap:wrap;line-height:1.6}
.menucap b{color:var(--ink)}
.lg{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;padding:2px 6px;border-radius:5px}
/* right / workspace */
.right{flex:1;min-width:0;overflow:auto;padding:26px;display:flex;flex-direction:column}
.wsempty{margin:auto;text-align:center;max-width:440px;color:var(--muted)}
.wssparkle{width:70px;height:70px;border-radius:18px;background:linear-gradient(135deg,#efe9ff,#fbe9f6);display:flex;align-items:center;justify-content:center;color:#6d28d9;font-size:30px;margin:0 auto 16px}
.wsempty h2{color:var(--ink);font-size:20px;margin:0 0 8px}
.wsempty p{font-size:14px;margin:0 0 18px}
.wsempty{max-width:520px}
.wschips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.wschips span{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 12px;font-size:12.5px;color:var(--text2);transition:.15s}
.wschips span:hover{border-color:var(--accent);color:var(--accent)}
.wslabel{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);margin:22px 0 4px}
.wshow{text-align:left;border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:16px 18px;box-shadow:0 6px 24px rgba(30,40,80,.05)}
.wshow .live{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;color:#16a34a;background:#eafaf0;border-radius:20px;padding:4px 11px;margin-bottom:13px}
.wshow .live .d{width:7px;height:7px;border-radius:50%;background:#16a34a;box-shadow:0 0 0 3px rgba(22,163,74,.16)}
.wsteps{display:flex;flex-direction:column;gap:11px;margin:2px 0 13px}
.wstep{display:flex;gap:11px;align-items:flex-start;font-size:13px;color:var(--text3);line-height:1.45}
.wstep b{color:var(--ink)}
.wsnum{flex:0 0 22px;height:22px;border-radius:50%;background:linear-gradient(135deg,#6d28d9,#e0189e);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.wsnote{font-size:12.5px;color:var(--muted);line-height:1.55;border-top:1px dashed var(--line);padding-top:12px}
.wsnote b{color:var(--ink)}
.wstablabel{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);font-weight:700;border-top:1px dashed var(--line);padding-top:13px;margin-top:13px}
.wstabs{display:flex;flex-direction:column;gap:9px;margin:9px 0 2px}
.wstab{font-size:12.5px;color:var(--muted);line-height:1.45;display:flex;gap:9px;align-items:flex-start}
.wstab .k{flex:0 0 auto;min-width:96px;font-weight:700;color:var(--accent)}
.helpbtn{margin-left:auto;font-size:11.5px;color:var(--muted);border:1px solid var(--line);border-radius:20px;padding:3px 11px;cursor:pointer;font-weight:600}
.helpbtn:hover{border-color:var(--accent);color:var(--accent)}
/* artifact card */
.artifact{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;max-width:640px;width:100%;margin:0 auto;box-shadow:0 8px 30px rgba(30,40,80,.06)}
.ahead{display:flex;align-items:flex-start;gap:12px}
.aico{width:40px;height:40px;border-radius:11px;background:var(--panel2);display:flex;align-items:center;justify-content:center}.aico svg{width:19px;height:19px}
.atag{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--accent);font-weight:700}
.ahead h3{margin:2px 0 0;font-size:18px}
.ax{margin-left:auto;border:0;background:0;font-size:22px;color:var(--faint);cursor:pointer;line-height:1}.ax:hover{color:var(--ink)}
.adesc{color:var(--muted);font-size:13px;margin:12px 0 16px}.askill{font-family:ui-monospace,monospace;font-size:11px;color:var(--faint)}
.fld{margin-bottom:12px}.fld label{display:block;font-size:12px;font-weight:600;color:#4a5468;margin-bottom:5px}
.fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:13.5px;font-family:inherit;outline:none;background:var(--panel2)}
.fld textarea{min-height:64px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--accent);background:var(--panel)}
.muted{color:var(--muted);font-size:13px}
.prev{margin-top:6px}.plabel{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);margin-bottom:6px}
.ptext{background:var(--code);color:var(--codeink);border-radius:10px;padding:13px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;white-space:pre-wrap;line-height:1.55;max-height:220px;overflow:auto}
.arow{display:flex;gap:10px;margin-top:16px}
.btn{border:0;border-radius:9px;padding:10px 16px;font-size:13.5px;font-weight:700;cursor:pointer}
.btn.primary{background:linear-gradient(135deg,#6d28d9,#e0189e);color:#fff}.btn.primary:hover{filter:brightness(1.05)}
.btn.ghost{background:var(--panel2);color:var(--text2)}
.ahint{font-size:11.5px;color:var(--faint);margin-top:11px}
/* status bar */
.statusbar{height:30px;flex:0 0 30px;background:var(--panel);border-top:1px solid var(--line);display:flex;align-items:center;gap:20px;padding:0 16px;font-size:11.5px;color:var(--muted)}
.statusbar .ok{color:var(--g)}.statusbar span:last-child{margin-left:auto}
.hmodal{position:fixed;inset:0;background:rgba(20,26,45,.45);display:none;align-items:center;justify-content:center;z-index:60;padding:24px}
.hmodal.show{display:flex}
.hcard{background:var(--bg);border-radius:16px;max-width:560px;width:100%;max-height:88vh;overflow:auto;padding:22px;position:relative;box-shadow:0 24px 70px rgba(20,26,45,.35)}
.hcard h3{margin:0 0 4px;font-size:17px;color:var(--ink)}
.hcard .hsub{margin:0 0 14px;font-size:13px;color:var(--muted)}
.hcard .hx{position:absolute;top:14px;right:16px;cursor:pointer;color:var(--muted);font-size:22px;line-height:1;border:0;background:none}
.harow{margin-top:16px;text-align:right}
.toast{position:fixed;bottom:44px;left:50%;transform:translateX(-50%) translateY(16px);opacity:0;background:#16a34a;color:#fff;font-weight:700;padding:10px 18px;border-radius:10px;font-size:13px;z-index:70;transition:.25s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.themebtn{cursor:pointer;font-size:15px;color:var(--muted);line-height:1;user-select:none;flex:0 0 auto}
.themebtn:hover{color:var(--accent)}
.statusbar .ver{margin-left:auto}
.statusbar .ver a{color:var(--muted);text-decoration:none}
.statusbar .ver a:hover{color:var(--accent)}
.hlinks{font-size:12px;color:var(--muted);margin-top:14px;padding-top:12px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.hlinks a{color:var(--accent);text-decoration:none;font-weight:600}

  <div class="tnav" id="tnav"></div>
  <div class="tr"><span class="themebtn" id="themeBtn" title="Dark mode">&#9790;</span><span class="tenant" id="tenant">Your Business &#9662;</span><span class="avatar" id="userAvatar"></span></div>
</div>
<div class="main">
  <aside class="left">
    <div class="asst"><div class="aavatar">&#10022;</div><div><div class="aname" id="asstName">Your Business</div><div class="arole">AI Operator · powered by EIQ</div></div><span class="status">&#9679; Ready</span><span class="helpbtn" id="helpBtn">? How it works</span></div>

      <button class="tab" data-mode="dash">Dashboard</button>
    </div>
    <div class="lsearch"><input id="search" placeholder="Search commands…"></div>
    <div class="menu" id="menu"></div>
  </aside>
  <section class="right" id="workspace"></section>
</div>

<script>
/* =====================================================================
   WHITE-LABEL CONFIG — the only per-client values. The console-generator
   fills `businesses` and `businessName` from the connected EIQ tenants at
   build time; nothing client-specific is hardcoded anywhere else.
   ===================================================================== */
const CONFIG={
  ownerName:'',                                 // the person's first name, for the greeting (e.g. 'Tony')
  businessName:'Your Business',                 // active business shown in the header
  businesses:['Your Business'],                 // switcher list — one per connected tenant
  site:'https://evolvepreneuriq.app',
  version:'0.4.0',
  updatesUrl:'https://github.com/evolvesystems/evolvepreneuriq-plugins',  // where 'check for updates' points
  updatesFeed:'https://cdn.jsdelivr.net/gh/evolvesystems/evolvepreneuriq-plugins@main/version.json', // polled on load; shows 'update available' if newer
  sections:[                                     // top-nav shortcuts → generic platform paths
    ['Workspace','workspace'],['CRM','crm-marketing#contacts'],['Media Studio','media-studio'],
    ['Commerce','ecommerce'],['Analytics','admin/analytics'],['Comms Hub','communication-hub'],
    ['Evolve Docs','evolve-docs'],['My Work','my-work#today']
  ]
};
let activeBiz=CONFIG.businesses[0];
const BRAND='Evolvepreneur<span class="reg">®</span>iQ Workplace';
const BIZ=CONFIG.businesses;
const BRANDS = { all:{name:"All", color:"#7c8aa5"} };

/* ---------- lanes ---------- */
const LANES = [
  {id:"dash",    name:"Dashboard & Data",   color:"#17b0f3"},
  {id:"write",   name:"Write & Voice",       color:"#8b5cf6"},
  {id:"brain",   name:"Business Brain",      color:"#14b8a6"},
  {id:"train",   name:"Train & Improve",     color:"#a855f7"},
  {id:"outreach",name:"Outreach & Sales",    color:"#f43f5e"},
  {id:"content", name:"Content & Repurpose", color:"#f59e0b"},
  {id:"build",   name:"Build & Publish",     color:"#22d3ee"},
  {id:"data",    name:"Data, Money & CRM",   color:"#10b981"},
  {id:"books",   name:"Books & Publishing",  color:"#eab308"},
  {id:"ads",     name:"Ads & Video",         color:"#ec4899"},
  {id:"ops",     name:"Ops & Admin",         color:"#60a5fa"}
];

/* helper for field defs */
const sel = (label,opts,def)=>({type:"select",label,options:opts,def:def??opts[0]});
const txt = (label,ph)=>({type:"text",label,ph:ph||""});
const area= (label,ph)=>({type:"textarea",label,ph:ph||""});

/* ---------- actions ---------- */
/* each: {id,lane,title,desc,skill,brands:[],fields:{key:def},template(v)} */
const ACTIONS = [
  /* DASHBOARD & DATA — build/read the Dashboard tab from live EIQ connectors */
  {id:"dash-refresh",lane:"dash",title:"Refresh my dashboard from EIQ",desc:"Pull live numbers from every connected tenant and rebuild the Dashboard tab.",skill:"eiq-commercial-analysis",brands:["all"],
   fields:{scope:sel("Scope",["All connected tenants","Just the active business"])},
   template:v=>`Refresh the Dashboard tab of my Evolvepreneur iQ console — ${v.scope}. For each connected EIQ tenant, pull the module data its connector actually returns: get_revenue_summary, get_customer_analytics, eiq_accounting (pnl + ar_aging), eiq_deal (pipeline_summary), get_subscription_health, eiq_royalty (summary + by_platform) and eiq_analytics. Build it connector-driven — only show the sections a tenant has data for — and consolidate a Group view. Do NOT invent figures. Rebuild the console HTML and update the artifact. Keep all of my real data in my private artifact only.`},
  {id:"dash-finance",lane:"dash",title:"Finance & P&L review",desc:"Read the P&L, margins and cash drains from Evolve Accounts.",skill:"eiq-business-planning",brands:["all"],
   fields:{biz:sel("Business",BIZ),period:sel("Period",["This financial year","Last financial year","Last 12 months"])},
   template:v=>`Give me a finance review for ${v.biz} for ${v.period} from the EiQ accounting data (eiq_accounting: pnl, ar_aging, ap_aging, vendor_spend). Show revenue and expenses by GL account, net profit, the biggest cost drivers, and any lines that look high. Flag AR outstanding and top vendors. End with the 3 moves that would most improve net.`},
  {id:"dash-pipeline",lane:"dash",title:"Sales pipeline & deals review",desc:"Open value, win rate and what to chase from the EIQ CRM.",skill:"eiq-commercial-analysis",brands:["all"],
   fields:{biz:sel("Business",BIZ)},
   template:v=>`Review the sales pipeline for ${v.biz} from the EIQ CRM (eiq_deal: pipeline_summary + list). Break down deals by stage (won / lost / open value), win rate by value and by count, and how much sits in live stages right now. List the open deals worth chasing with their value and stage, and tell me whether the near-term pipeline is thick or thin.`},
  {id:"dash-customers",lane:"dash",title:"Top customers & concentration",desc:"Rank customers, concentration and reactivation targets.",skill:"eiq-commercial-analysis",brands:["all"],
   fields:{biz:sel("Business",BIZ),n:sel("How many",["Top 20","Top 50","Top 100"])},
   template:v=>`For ${v.biz}, give me a top-customers deep-dive from the EIQ data: ${v.n} paying customers by lifetime spend, revenue concentration (top 1 / top 10 share), repeat vs one-time split, and a reactivation list of high-value customers with no order in 12+ months. Flag anything surprising.`},
  {id:"dash-traffic",lane:"dash",title:"Traffic quality audit",desc:"EIQ Analytics: channels, bounce, top pages, junk traffic.",skill:"eiq-commercial-analysis",brands:["all"],
   fields:{biz:sel("Business",BIZ),days:sel("Window",["Last 365 days","Last 90 days","Last 30 days"])},
   template:v=>`Run a website traffic quality audit for ${v.biz} using EIQ Analytics (${v.days}, bots excluded). Break down visits by channel with bounce % and mobile %, list top pages/sites and geo, and separate low-quality traffic from the real engaged audience. End with 3 concrete fixes.`},
  {id:"dash-board",lane:"dash",title:"Group snapshot for a board update",desc:"One-page consolidated summary across all tenants.",skill:"eiq-business-planning",brands:["all"],
   fields:{period:sel("Period",["Last 12 months","This calendar year","All-time"])},
   template:v=>`Build a one-page group snapshot across all connected tenants for ${v.period}, from the EIQ data: consolidated revenue, customers, and web visits, a per-tenant comparison, and the 3 things that most need attention. Write it as a tight board update — no fluff.`},
  /* WRITE & VOICE */
  {id:"voice-write",lane:"write",title:"Write in your brand voice",desc:"Any copy in your natural brand voice — no AI slop.",skill:"brand-voice · human-voice-writer",brands:["all"],
   fields:{biz:sel("Business",BIZ),type:sel("Content type",["email","blog post","landing page","social post","About page","newsletter","sales page"]),topic:txt("Topic / what it's about","e.g. a new service you're launching"),who:txt("Audience","e.g. your ideal customer")},
   template:v=>`Write a ${v.type} about "${v.topic}" for ${v.who||"my usual audience"} (${v.biz}). Use my brand voice (apply the brand-voice rules and human-voice-writer) — natural, specific, no AI slop, no rule-of-three clichés.`},

  {id:"house-voice",lane:"write",title:"Write in a brand's house voice",desc:"Content in one specific brand's established house voice.",skill:"brand-voice",brands:["all"],
   fields:{biz:sel("Business",BIZ),type:sel("Content type",["newsletter edition","blog post","email","social post","course lesson","member update"]),topic:txt("Topic","e.g. this week's theme")},
   template:v=>`Write a ${v.type} about "${v.topic}" in the ${v.biz} house voice (use brand-voice) — on-brand, specific and human.`},

  {id:"deslop",lane:"write",title:"De-slop a draft",desc:"Make an existing draft sound human, not AI.",skill:"de-slop-editor",brands:["all"],
   fields:{draft:area("Paste the draft to clean up","Paste your text here...")},
   template:v=>`Clean up this draft so it reads like a real person wrote it — strip clichés, corporate filler and AI tells, keep my brand voice (de-slop-editor):\n\n${v.draft||"[paste your draft here]"}`},

  {id:"ai-check",lane:"write",title:"Is this AI-written?",desc:"Screen a piece for AI-generated signals.",skill:"ai-content-detector",brands:["all"],
   fields:{draft:area("Paste the text to check","Paste text here...")},
   template:v=>`Assess how likely this text is AI-generated and quote the specific signals (ai-content-detector):\n\n${v.draft||"[paste the text here]"}`},

  /* OUTREACH & SALES */
  {id:"outreach",lane:"outreach",title:"Warm prospect outreach",desc:"Personalised re-connection emails / LinkedIn DMs in your voice, loaded to EvolveMail.",skill:"evolve-outreach",brands:["all"],
   fields:{biz:sel("Business",BIZ),channel:sel("Channel",["email","LinkedIn DM","both"]),who:txt("List / segment","e.g. lapsed leads from last quarter"),angle:txt("Angle / reason to reconnect","e.g. a new offer")},
   template:v=>`Write warm ${v.channel} outreach in my brand voice for ${v.who||"my prospect list"} (${v.biz}). Angle: ${v.angle||"reconnect and re-open the conversation"}. Pull the contacts from EIQ, personalise each one, and load them into EvolveMail as reviewable drafts (evolve-outreach).`},

  {id:"prospects",lane:"outreach",title:"Mine EIQ for prospects",desc:"Dig the CRM, email, LinkedIn archive & transcripts for leads / a Dream 100.",skill:"eiq-commercial-analysis",brands:["all"],
   fields:{biz:sel("Business",BIZ),crit:txt("Who counts as a good lead","e.g. people who enquired but never bought")},
   template:v=>`Using the ${v.biz} EIQ connector, mine my CRM, inbox and LinkedIn archive for prospects: ${v.crit||"my best re-engagement opportunities"}. Rank them and give me a shortlist with why each one made it (eiq-commercial-analysis).`},

  {id:"personas",lane:"outreach",title:"Build buyer personas",desc:"Personas built from your real EIQ customer data.",skill:"eiq-commercial-analysis",brands:["all"],
   fields:{biz:sel("Business",BIZ)},
   template:v=>`Build buyer personas for ${v.biz} from my actual EIQ data — spend patterns, products bought, source. Give me 3–5 grounded personas (eiq-commercial-analysis).`},

function jump(m,id){

  /* shared traffic renderer (EIQ Analytics) */
  function renderTraffic(ws,brand){

    ws.innerHTML=head('Marketing & Traffic','Website traffic from EIQ Analytics (the platform’s Matomo store).')+
      '<div class="dk-note"><b>Source: EIQ Analytics</b> · last 365 days · bots excluded.'+(t.note?' '+t.note:'')+'</div>'+
      '<div class="dk-kpis">'+
        kpi('Website visits — 12 mo',num(t.visits),num(t.unique)+' unique',1)+
        kpi('Bounce rate',t.bounce+'%','avg visit '+t.dur+'s')+
        kpi('Returning visitors',num(t.ret),(100*t.ret/t.visits).toFixed(0)+'% of traffic')+
        kpi('Top channel',t.ch[0][0],num(t.ch[0][1])+' visits')+
        (t.extra?kpi(t.extra[0],t.extra[1]):'')+
      '</div>'+
      (t.quality?'<div class="dk-note dk-warn">'+t.quality+'</div>':'')+
      '<div class="dk-g2">'+

      '</div>';
    var A=axes();
    chart('dc1',{type:'bar',data:{labels:t.ch.map(function(c){return c[0];}),datasets:[{data:t.ch.map(function(c){return c[1];}),backgroundColor:['#94a3b8','#0d9488','#6d28d9','#0284c7','#d97706'],borderRadius:4}]},options:{plugins:{legend:{display:false},tooltip:{callbacks:{label:function(c){return num(c.raw)+' visits';}}}},scales:{y:A.grid,x:A.no}}});
    chart('dc2',{type:'bar',data:{labels:t.pages.map(function(p){return p[0];}),datasets:[{data:t.pages.map(function(p){return p[1];}),backgroundColor:'#0284c7',borderRadius:4}]},options:{indexAxis:'y',plugins:{legend:{display:false},tooltip:{callbacks:{label:function(c){return num(c.raw)+' visits';}}}},scales:{x:A.grid,y:Object.assign({},A.no,{ticks:Object.assign({},A.no.ticks,{font:{size:10}})})}}});

      var top=b.customers[0], share=(top[3]/b.k.rev*100), t8=b.customers.reduce(function(a,c){return a+c[3];},0)/b.k.rev*100;

      chart('dc1',{type:'bar',data:{labels:ESGX.royYear.l,datasets:[{data:ESGX.royYear.v,backgroundColor:'#6d28d9',borderRadius:4}]},options:{plugins:{legend:{display:false},tooltip:{callbacks:{label:function(c){return money(c.raw);}}}},scales:{y:Object.assign({},A.grid,{ticks:Object.assign({},A.grid.ticks,{callback:moneyK})}),x:A.no}}});

  /* ---- expose + tab wiring ---- */
  window.renderDash=function(){
    var ws=document.getElementById('workspace'); if(!ws)return; ws.className='right dk';
    if(!DS.source){ ws.innerHTML='<div class="dk-empty"><div class="i">◔</div><h3>Dashboard not built yet</h3><p>This console has no dashboard data loaded. Ask me to <b>“refresh my dashboard from EIQ”</b> and I’ll pull your live numbers (revenue, customers, finance, pipeline, royalties and traffic) from whichever connectors are attached, then rebuild this tab.</p></div>'; var m=document.getElementById('menu'); if(m)m.innerHTML=''; return; }

  /* tab routing is handled by the console shell, which calls window.renderDash() on the dash tab. */
})();
