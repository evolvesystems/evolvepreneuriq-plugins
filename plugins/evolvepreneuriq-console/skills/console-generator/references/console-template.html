<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Evolvepreneur®iQ Workplace</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;height:100vh;overflow:hidden}
:root{--bg:#eef0f5;--panel:#fff;--panel2:#f6f7fb;--hover:#f2eefe;--line:#e5e8f0;--ink:#1b2233;--muted:#6b7488;--faint:#9aa3b5;--text2:#5a6478;--text3:#3a4256;--accent:#6d28d9;--accent2:#e0189e;--g:#16a34a;--code:#0f1420;--codeink:#dfe6f2}html[data-theme="dark"]{--bg:#0f1420;--panel:#191f2e;--panel2:#222b3d;--hover:#262042;--line:#2a3346;--ink:#e8edf6;--muted:#9aa5ba;--faint:#697488;--text2:#aeb8cc;--text3:#c7d0e0;--g:#34d399;--code:#0a0e16;--codeink:#dfe6f2}
/* top bar */
.topbar{height:52px;flex:0 0 52px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 16px;gap:16px}
.tl{display:flex;align-items:center;gap:12px}.burger{color:var(--faint);font-size:18px}
.brand{display:flex;align-items:center;gap:9px;font-size:15px}
.blogo{width:28px;height:28px;border-radius:8px;overflow:hidden;display:block;flex:0 0 auto}
.tnav{display:flex;gap:20px;color:var(--text2);font-size:13px}.tnav span:hover{color:var(--accent);cursor:default}
.tr{display:flex;align-items:center;gap:12px}
.tenant{font-size:13px;color:var(--text3);border:1px solid var(--line);border-radius:8px;padding:5px 11px;cursor:pointer}
.tr{position:relative}
.bizmenu{position:absolute;top:40px;right:38px;background:var(--panel);border:1px solid var(--line);border-radius:11px;box-shadow:0 14px 38px rgba(20,26,45,.2);padding:5px;min-width:200px;z-index:45}
.bizitem{padding:8px 11px;border-radius:7px;font-size:13px;color:var(--text3);cursor:pointer}
.bizitem:hover{background:var(--hover)}
.bizitem.on{color:var(--accent);font-weight:700}
.bizhint{padding:8px 11px;font-size:11px;color:var(--faint);line-height:1.4;border-top:1px solid var(--line);margin-top:3px}
.avatar{width:28px;height:28px;border-radius:50%;background:#6d28d9;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:0 0 auto}
/* main */
.main{flex:1;display:flex;min-height:0}
.left{width:430px;flex:0 0 430px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.asst{display:flex;align-items:center;gap:11px;padding:14px 16px;border-bottom:1px solid var(--line)}
.aavatar{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#efe9ff,#fbe9f6);display:flex;align-items:center;justify-content:center;color:#6d28d9;font-size:17px;flex:0 0 auto}
.aname{font-weight:700;font-size:14px}.reg{font-size:.62em;vertical-align:super;font-weight:600;opacity:.85}.arole{font-size:12px;color:var(--muted)}
.status{margin-left:auto;font-size:11.5px;color:var(--g);font-weight:600}
.tabs{display:flex;gap:4px;padding:10px 12px 0}
.tab{flex:1;border:0;background:transparent;color:var(--muted);font-size:12px;font-weight:600;padding:8px 6px;border-radius:8px;cursor:pointer;border-bottom:2px solid transparent}
.tab:hover{color:var(--ink)}.tab.on{color:var(--accent);border-bottom-color:var(--accent);background:#f7f4ff}
.lsearch{padding:10px 12px}
.lsearch input{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 12px;font-size:13px;outline:none;background:var(--panel2)}
.lsearch input:focus{border-color:var(--accent);background:var(--panel)}
.menu{overflow:auto;padding:2px 10px 16px;flex:1}
.sec{margin-bottom:2px}
.sechead{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:9px;cursor:pointer}
.sechead:hover{background:#f5f6fa}
.chev{width:12px;color:var(--faint);font-size:10px;display:inline-flex;justify-content:center}
.secico{display:inline-flex}.secico svg{width:16px;height:16px}
.secname{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#4a5468}
.seccount{margin-left:auto;font-size:11px;color:var(--faint);font-weight:600}
.mrow{display:flex;align-items:center;gap:10px;padding:7px 12px 7px 30px;border-radius:8px;cursor:pointer}
.mrow:hover{background:var(--hover)}
.mdot{width:7px;height:7px;border-radius:50%}
.mtitle{font-size:13px;font-weight:500}
.rw{margin-left:auto;font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;padding:2px 6px;border-radius:5px;flex:0 0 auto}
.rw-read{background:#eef1f6;color:#647089}
.rw-draft{background:#fef3c7;color:#b45309}
.rw-write{background:#dcfce7;color:#15803d}
.menucap{font-size:11.5px;color:var(--muted);padding:2px 12px 10px;display:flex;align-items:center;gap:5px;flex-wrap:wrap;line-height:1.6}
.menucap b{color:var(--ink)}
.lg{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;padding:2px 6px;border-radius:5px}
/* right / workspace */
.right{flex:1;min-width:0;overflow:auto;padding:26px;display:flex;flex-direction:column}
.wsempty{margin:auto;text-align:center;max-width:440px;color:var(--muted)}
.wssparkle{width:70px;height:70px;border-radius:18px;background:linear-gradient(135deg,#efe9ff,#fbe9f6);display:flex;align-items:center;justify-content:center;color:#6d28d9;font-size:30px;margin:0 auto 16px}
.wsempty h2{color:var(--ink);font-size:20px;margin:0 0 8px}
.wsempty p{font-size:14px;margin:0 0 18px}
.wsempty{max-width:520px}
.wschips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.wschips span{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 12px;font-size:12.5px;color:var(--text2);transition:.15s}
.wschips span:hover{border-color:var(--accent);color:var(--accent)}
.wslabel{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);margin:22px 0 4px}
.wshow{text-align:left;border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:16px 18px;box-shadow:0 6px 24px rgba(30,40,80,.05)}
.wshow .live{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;color:#16a34a;background:#eafaf0;border-radius:20px;padding:4px 11px;margin-bottom:13px}
.wshow .live .d{width:7px;height:7px;border-radius:50%;background:#16a34a;box-shadow:0 0 0 3px rgba(22,163,74,.16)}
.wsteps{display:flex;flex-direction:column;gap:11px;margin:2px 0 13px}
.wstep{display:flex;gap:11px;align-items:flex-start;font-size:13px;color:var(--text3);line-height:1.45}
.wstep b{color:var(--ink)}
.wsnum{flex:0 0 22px;height:22px;border-radius:50%;background:linear-gradient(135deg,#6d28d9,#e0189e);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.wsnote{font-size:12.5px;color:var(--muted);line-height:1.55;border-top:1px dashed var(--line);padding-top:12px}
.wsnote b{color:var(--ink)}
.wstablabel{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);font-weight:700;border-top:1px dashed var(--line);padding-top:13px;margin-top:13px}
.wstabs{display:flex;flex-direction:column;gap:9px;margin:9px 0 2px}
.wstab{font-size:12.5px;color:var(--muted);line-height:1.45;display:flex;gap:9px;align-items:flex-start}
.wstab .k{flex:0 0 auto;min-width:96px;font-weight:700;color:var(--accent)}
.helpbtn{margin-left:auto;font-size:11.5px;color:var(--muted);border:1px solid var(--line);border-radius:20px;padding:3px 11px;cursor:pointer;font-weight:600}
.helpbtn:hover{border-color:var(--accent);color:var(--accent)}
/* artifact card */
.artifact{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;max-width:640px;width:100%;margin:0 auto;box-shadow:0 8px 30px rgba(30,40,80,.06)}
.ahead{display:flex;align-items:flex-start;gap:12px}
.aico{width:40px;height:40px;border-radius:11px;background:var(--panel2);display:flex;align-items:center;justify-content:center}.aico svg{width:19px;height:19px}
.atag{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--accent);font-weight:700}
.ahead h3{margin:2px 0 0;font-size:18px}
.ax{margin-left:auto;border:0;background:0;font-size:22px;color:var(--faint);cursor:pointer;line-height:1}.ax:hover{color:var(--ink)}
.adesc{color:var(--muted);font-size:13px;margin:12px 0 16px}.askill{font-family:ui-monospace,monospace;font-size:11px;color:var(--faint)}
.fld{margin-bottom:12px}.fld label{display:block;font-size:12px;font-weight:600;color:#4a5468;margin-bottom:5px}
.fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:13.5px;font-family:inherit;outline:none;background:var(--panel2)}
.fld textarea{min-height:64px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--accent);background:var(--panel)}
.muted{color:var(--muted);font-size:13px}
.prev{margin-top:6px}.plabel{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);margin-bottom:6px}
.ptext{background:var(--code);color:var(--codeink);border-radius:10px;padding:13px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;white-space:pre-wrap;line-height:1.55;max-height:220px;overflow:auto}
.arow{display:flex;gap:10px;margin-top:16px}
.btn{border:0;border-radius:9px;padding:10px 16px;font-size:13.5px;font-weight:700;cursor:pointer}
.btn.primary{background:linear-gradient(135deg,#6d28d9,#e0189e);color:#fff}.btn.primary:hover{filter:brightness(1.05)}
.btn.ghost{background:var(--panel2);color:var(--text2)}
.ahint{font-size:11.5px;color:var(--faint);margin-top:11px}
/* status bar */
.statusbar{height:30px;flex:0 0 30px;background:var(--panel);border-top:1px solid var(--line);display:flex;align-items:center;gap:20px;padding:0 16px;font-size:11.5px;color:var(--muted)}
.statusbar .ok{color:var(--g)}.statusbar span:last-child{margin-left:auto}
.hmodal{position:fixed;inset:0;background:rgba(20,26,45,.45);display:none;align-items:center;justify-content:center;z-index:60;padding:24px}
.hmodal.show{display:flex}
.hcard{background:var(--bg);border-radius:16px;max-width:560px;width:100%;max-height:88vh;overflow:auto;padding:22px;position:relative;box-shadow:0 24px 70px rgba(20,26,45,.35)}
.hcard h3{margin:0 0 4px;font-size:17px;color:var(--ink)}
.hcard .hsub{margin:0 0 14px;font-size:13px;color:var(--muted)}
.hcard .hx{position:absolute;top:14px;right:16px;cursor:pointer;color:var(--muted);font-size:22px;line-height:1;border:0;background:none}
.harow{margin-top:16px;text-align:right}
.toast{position:fixed;bottom:44px;left:50%;transform:translateX(-50%) translateY(16px);opacity:0;background:#16a34a;color:#fff;font-weight:700;padding:10px 18px;border-radius:10px;font-size:13px;z-index:70;transition:.25s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.themebtn{cursor:pointer;font-size:15px;color:var(--muted);line-height:1;user-select:none;flex:0 0 auto}
.themebtn:hover{color:var(--accent)}
.statusbar .ver{margin-left:auto}
.statusbar .ver a{color:var(--muted);text-decoration:none}
.statusbar .ver a:hover{color:var(--accent)}
.hlinks{font-size:12px;color:var(--muted);margin-top:14px;padding-top:12px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.hlinks a{color:var(--accent);text-decoration:none;font-weight:600}
</style></head><body>
<div class="topbar">
  <div class="tl"><span class="burger">&#9776;</span><span class="brand" id="brandHome"><span class="blogo"><svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;display:block"><defs><linearGradient id="eiqA" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#17b0f3"/><stop offset=".5" stop-color="#6a24c8"/><stop offset="1" stop-color="#e0189e"/></linearGradient></defs><rect x="3" y="3" width="94" height="94" rx="26" fill="url(#eiqA)"/><rect x="27" y="58" width="11" height="27" rx="3.5" fill="#fff" opacity=".30"/><rect x="60" y="50" width="11" height="35" rx="3.5" fill="#fff" opacity=".30"/><rect x="74" y="42" width="11" height="43" rx="3.5" fill="#fff" opacity=".42"/><path d="M30 20l2.6 6.4L39 29l-6.4 2.6L30 38l-2.6-6.4L21 29l6.4-2.6z" fill="#fff"/><path d="M33 88c7-15 1-24 14-30 9-4 6-13 16-20" fill="none" stroke="#fff" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M58 33l16-6-3 17z" fill="#fff"/></svg></span><b id="bizName">Your Business</b></span></div>
  <div class="tnav" id="tnav"></div>
  <div class="tr"><span class="themebtn" id="themeBtn" title="Dark mode">&#9790;</span><span class="tenant" id="tenant">Your Business &#9662;</span><span class="avatar" id="userAvatar"></span></div>
</div>
<div class="main">
  <aside class="left">
    <div class="asst"><div class="aavatar">&#10022;</div><div><div class="aname" id="asstName">Your Business</div><div class="arole">AI Operator · powered by EIQ</div></div><span class="status">&#9679; Ready</span><span class="helpbtn" id="helpBtn">? How it works</span></div>
    <div class="tabs">

<script>
/* =====================================================================
   WHITE-LABEL CONFIG — the only per-client values. The console-generator
   fills `businesses` and `businessName` from the connected EIQ tenants at
   build time; nothing client-specific is hardcoded anywhere else.
   ===================================================================== */
const CONFIG={
  ownerName:'',                                 // the person's first name, for the greeting (e.g. 'Tony')
  businessName:'Your Business',                 // active business shown in the header
  businesses:['Your Business'],                 // switcher list — one per connected tenant
  site:'https://evolvepreneuriq.app',
  version:'0.3.0',
  updatesUrl:'https://github.com/evolvesystems/evolvepreneuriq-plugins',  // where 'check for updates' points
  updatesFeed:'https://cdn.jsdelivr.net/gh/evolvesystems/evolvepreneuriq-plugins@main/version.json', // polled on load; shows 'update available' if newer
  sections:[                                     // top-nav shortcuts → generic platform paths
    ['Workspace','workspace'],['CRM','crm-marketing#contacts'],['Media Studio','media-studio'],
    ['Commerce','ecommerce'],['Analytics','admin/analytics'],['Comms Hub','communication-hub'],
    ['Evolve Docs','evolve-docs'],['My Work','my-work#today']
  ]
};
let activeBiz=CONFIG.businesses[0];
const BRAND='Evolvepreneur<span class="reg">®</span>iQ Workplace';
const BIZ=CONFIG.businesses;
const BRANDS = { all:{name:"All", color:"#7c8aa5"} };

/* ---------- lanes ---------- */
const LANES = [
  {id:"write",   name:"Write & Voice",       color:"#8b5cf6"},
  {id:"brain",   name:"Business Brain",      color:"#14b8a6"},
  {id:"train",   name:"Train & Improve",     color:"#a855f7"},
  {id:"outreach",name:"Outreach & Sales",    color:"#f43f5e"},
  {id:"content", name:"Content & Repurpose", color:"#f59e0b"},
  {id:"build",   name:"Build & Publish",     color:"#22d3ee"},
  {id:"data",    name:"Data, Money & CRM",   color:"#10b981"},
  {id:"books",   name:"Books & Publishing",  color:"#eab308"},
  {id:"ads",     name:"Ads & Video",         color:"#ec4899"},
  {id:"ops",     name:"Ops & Admin",         color:"#60a5fa"}
];

/* helper for field defs */
const sel = (label,opts,def)=>({type:"select",label,options:opts,def:def??opts[0]});
const txt = (label,ph)=>({type:"text",label,ph:ph||""});
const area= (label,ph)=>({type:"textarea",label,ph:ph||""});

/* ---------- actions ---------- */
/* each: {id,lane,title,desc,skill,brands:[],fields:{key:def},template(v)} */
const ACTIONS = [
  /* WRITE & VOICE */
  {id:"voice-write",lane:"write",title:"Write in your brand voice",desc:"Any copy in your natural brand voice — no AI slop.",skill:"brand-voice · human-voice-writer",brands:["all"],
   fields:{biz:sel("Business",BIZ),type:sel("Content type",["email","blog post","landing page","social post","About page","newsletter","sales page"]),topic:txt("Topic / what it's about","e.g. a new service you're launching"),who:txt("Audience","e.g. your ideal customer")},
   template:v=>`Write a ${v.type} about "${v.topic}" for ${v.who||"my usual audience"} (${v.biz}). Use my brand voice (apply the brand-voice rules and human-voice-writer) — natural, specific, no AI slop, no rule-of-three clichés.`},

  {id:"house-voice",lane:"write",title:"Write in a brand's house voice",desc:"Content in one specific brand's established house voice.",skill:"brand-voice",brands:["all"],
   fields:{biz:sel("Business",BIZ),type:sel("Content type",["newsletter edition","blog post","email","social post","course lesson","member update"]),topic:txt("Topic","e.g. this week's theme")},
   template:v=>`Write a ${v.type} about "${v.topic}" in the ${v.biz} house voice (use brand-voice) — on-brand, specific and human.`},

  {id:"deslop",lane:"write",title:"De-slop a draft",desc:"Make an existing draft sound human, not AI.",skill:"de-slop-editor",brands:["all"],
   fields:{draft:area("Paste the draft to clean up","Paste your text here...")},
   template:v=>`Clean up this draft so it reads like a real person wrote it — strip clichés, corporate filler and AI tells, keep my brand voice (de-slop-editor):\n\n${v.draft||"[paste your draft here]"}`},

  {id:"ai-check",lane:"write",title:"Is this AI-written?",desc:"Screen a piece for AI-generated signals.",skill:"ai-content-detector",brands:["all"],
   fields:{draft:area("Paste the text to check","Paste text here...")},
   template:v=>`Assess how likely this text is AI-generated and quote the specific signals (ai-content-detector):\n\n${v.draft||"[paste the text here]"}`},

  /* OUTREACH & SALES */
  {id:"outreach",lane:"outreach",title:"Warm prospect outreach",desc:"Personalised re-connection emails / LinkedIn DMs in your voice, loaded to EvolveMail.",skill:"evolve-outreach",brands:["all"],
   fields:{biz:sel("Business",BIZ),channel:sel("Channel",["email","LinkedIn DM","both"]),who:txt("List / segment","e.g. lapsed leads from last quarter"),angle:txt("Angle / reason to reconnect","e.g. a new offer")},
   template:v=>`Write warm ${v.channel} outreach in my brand voice for ${v.who||"my prospect list"} (${v.biz}). Angle: ${v.angle||"reconnect and re-open the conversation"}. Pull the contacts from EIQ, personalise each one, and load them into EvolveMail as reviewable drafts (evolve-outreach).`},

  {id:"prospects",lane:"outreach",title:"Mine EIQ for prospects",desc:"Dig the CRM, email, LinkedIn archive & transcripts for leads / a Dream 100.",skill:"eiq-commercial-analysis",brands:["all"],
   fields:{biz:sel("Business",BIZ),crit:txt("Who counts as a good lead","e.g. people who enquired but never bought")},
   template:v=>`Using the ${v.biz} EIQ connector, mine my CRM, inbox and LinkedIn archive for prospects: ${v.crit||"my best re-engagement opportunities"}. Rank them and give me a shortlist with why each one made it (eiq-commercial-analysis).`},

  {id:"personas",lane:"outreach",title:"Build buyer personas",desc:"Personas built from your real EIQ customer data.",skill:"eiq-commercial-analysis",brands:["all"],
   fields:{biz:sel("Business",BIZ)},
   template:v=>`Build buyer personas for ${v.biz} from my actual EIQ data — spend patterns, products bought, source. Give me 3–5 grounded personas (eiq-commercial-analysis).`},

  {id:"five-buyers",lane:"outreach",title:"Five Buyers review",desc:"Five buyers read your page and report exactly where each drops off.",skill:"five-buyers",brands:["all"],
   fields:{what:txt("Page / URL or paste","e.g. https://... or paste the copy")},
   template:v=>`Run Five Buyers on this and tell me who buys, who leaves, the exact line each one loses interest, and the highest-impact fixes: ${v.what||"[paste the page copy or URL]"}`},

  {id:"linkedsavvy",lane:"outreach",title:"LinkedSavvy campaign",desc:"Set up / edit a LinkedIn outreach campaign.",skill:"linkedsavvy-campaign-setup",brands:["all"],
   fields:{aud:txt("Target audience","e.g. coaches in your niche"),goal:txt("Goal","e.g. book discovery calls")},
   template:v=>`Set up a LinkedSavvy campaign targeting ${v.aud||"my ideal audience"} with the goal: ${v.goal||"start conversations"}. Draft the connection + follow-up sequence with spintax (linkedsavvy-campaign-setup).`},

  {id:"li-archive",lane:"outreach",title:"Dig your LinkedIn archive",desc:"Mine your LinkedIn messages, conversations and event leads for warm reconnections.",skill:"eiq_linkedin · eiq-commercial-analysis",brands:["all"],
   fields:{biz:sel("Business",BIZ),who:txt("What you're looking for","e.g. people you spoke to but never followed up")},
   template:v=>`Search my ${v.biz} LinkedIn archive (eiq_linkedin) for ${v.who||"warm reconnection opportunities"} — conversations gone quiet, event leads, people I never followed up. Rank them and tell me who to reach first.`},

  {id:"li-outreach",lane:"outreach",title:"LinkedIn → draft DMs",desc:"Turn LinkedIn leads into warm DMs in your voice, ready to review.",skill:"eiq_linkedin · evolve-outreach",brands:["all"],

const CONNECTOR_ACTIONS=CONNECTOR.map((s,i)=>({
  id:"cx_"+i,lane:s.cat,title:s.name,desc:s.desc,skill:s.code,brands:["all"],badge:RWLABEL[s.rw]||"read",
  fields:{biz:sel("Business",BIZ),task:txt("Specifics (optional)","e.g. last 90 days / this customer / this topic")},
  template:v=>`Using the ${v.biz} EIQ connector, ${s.ask}${v.task?` — ${v.task}`:''}. (${s.code})`
}));

const VIEWS={
  flows:{lanes:LANES,data:ACTIONS,brandAware:true},
  skills:{lanes:SKILL_LANES,data:SKILL_ACTIONS,brandAware:false},
  connector:{lanes:CONNECTOR_LANES,data:CONNECTOR_ACTIONS,brandAware:false},
  library:{lanes:LIB_LANES,data:LIB_ACTIONS,brandAware:true}
};

  video:'<polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/>',
  cart:'<circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/>',

  doc:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="13" y2="17"/>',

  mega:'<path d="M3 11l18-5v12L3 14v-3z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/>',
  data:'<line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',
  check:'<path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>',
  cap:'<path d="M22 10L12 5 2 10l10 5 10-5z"/><path d="M6 12v5c0 1 2.7 2.5 6 2.5s6-1.5 6-2.5v-5"/>',
  bot:'<rect x="3" y="8" width="18" height="12" rx="2"/><path d="M12 8V4M8 2h8"/><circle cx="9" cy="14" r="1"/><circle cx="15" cy="14" r="1"/>',
  brief:'<rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>',
  spark:'<path d="M12 3v4M12 17v4M3 12h4M17 12h4M5.6 5.6l2.8 2.8M15.6 15.6l2.8 2.8M18.4 5.6l-2.8 2.8M8.4 15.6l-2.8 2.8"/>',
  grid:'<rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>'
};
const ICON_MAP=[["money",["money","account","finance","revenue"]],["mail",["email","comms","communication","inbox"]],["video",["video"]],["cart",["commerce","ecom","product","ops"]],["web",["web","page","media"]],["build",["build","technical"]],["doc",["docs","publish","book"]],["pen",["write","writing","voice"]],["people",["crm","sales","contact","client","community"]],["send",["outreach"]],["layers",["content","repurpose"]],["mega",["market","ads"]],["data",["data","analytic"]],["search",["research","search"]],["check",["productivity"]],["cap",["learning"]],["bot",["ai"]],["brief",["business","project"]],["spark",["creative","general","custom"]]];
function iconFor(name){const n=(name||"").toLowerCase();for(const [ic,keys] of ICON_MAP){if(keys.some(k=>n.includes(k)))return svg(ICONS[ic]);}return svg(ICONS.grid);}

/* ---- command-center UI ---- */
let mode='flows', query='', expanded={}, current=null;
/* --- CONFIG — the ONLY per-client values, all generic (no tenant in the URL; the platform routes each logged-in user to their own workspace). --- */
function openSite(path){window.open(CONFIG.site+'/'+(path||''),'_blank','noopener');}
/* --- workspace quick-start chips → real commands in the menu --- */
const CHIPS=[['Draft an email','flows','campaign-module'],['This week’s newsletter','flows','newsletter'],['Morning brief','flows','morning'],['Find prospects','flows','prospects']];
function jump(m,id){
  mode=m;
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.mode===m));
  const view=VIEWS[m]; const a=view.data.find(x=>x.id===id); if(!a){renderMenu();return;}
  const lane=view.lanes.find(l=>l.id===a.lane);
  const key=m+'|'+a.lane; expanded[key]=true;
  renderMenu(); openAction(a,lane);
}
function matches(a){const q=query.trim().toLowerCase();return !q||(a.title+' '+a.desc+' '+a.skill+' '+a.lane).toLowerCase().includes(q);}
function renderMenu(){
  const view=VIEWS[mode]; const menu=document.getElementById('menu'); menu.innerHTML=''; const q=query.trim();
  if(mode==='connector'){const cap=document.createElement('div');cap.className='menucap';cap.innerHTML='<b>'+view.data.length+' live tools</b> Claude can call on your tenant &nbsp;·&nbsp; <span class="lg rw-read">read</span> <span class="lg rw-draft">draft</span> <span class="lg rw-write">write</span> can create &amp; update';menu.appendChild(cap);}
  view.lanes.forEach(lane=>{
    const items=view.data.filter(a=>a.lane===lane.id && matches(a)); if(!items.length) return;
    const key=mode+'|'+lane.id; const open=q?true:!!expanded[key];
    const sec=document.createElement('div'); sec.className='sec';
    const head=document.createElement('div'); head.className='sechead';
    head.innerHTML='<span class="chev">'+(open?'▾':'▸')+'</span><span class="secico" style="color:'+lane.color+'">'+iconFor(lane.name)+'</span><span class="secname">'+lane.name+'</span><span class="seccount">'+items.length+'</span>';
    if(!q) head.onclick=()=>{expanded[key]=!expanded[key];renderMenu();};
    sec.appendChild(head);
    if(open) items.forEach(a=>{const r=document.createElement('div');r.className='mrow';r.innerHTML='<span class="mdot" style="background:'+lane.color+'"></span><span class="mtitle">'+a.title+'</span>'+(a.badge?'<span class="rw rw-'+a.badge+'">'+a.badge+'</span>':'');r.onclick=()=>openAction(a,lane);sec.appendChild(r);});
    menu.appendChild(sec);
  });
}
function openAction(a,lane){
  current={a,lane};
  const fields=Object.entries(a.fields||{});
  let f=fields.map(([k,fd])=>{
    if(fd.type==='select'){const selVal=(k==='biz'&&fd.options.indexOf(activeBiz)>-1)?activeBiz:fd.def;const o=fd.options.map(x=>'<option '+(x===selVal?'selected':'')+'>'+x+'</option>').join('');return '<div class="fld"><label>'+fd.label+'</label><select data-k="'+k+'">'+o+'</select></div>';}
    if(fd.type==='textarea')return '<div class="fld"><label>'+fd.label+'</label><textarea data-k="'+k+'" placeholder="'+(fd.ph||'')+'"></textarea></div>';
    return '<div class="fld"><label>'+fd.label+'</label><input data-k="'+k+'" placeholder="'+(fd.ph||'')+'"></div>';
  }).join('');
  if(!fields.length) f='<div class="muted">No inputs needed — copy and run.</div>';
  document.getElementById('workspace').innerHTML='<div class="artifact"><div class="ahead"><span class="aico" style="color:'+lane.color+'">'+iconFor(lane.name)+'</span><div><div class="atag">'+lane.name+'</div><h3>'+a.title+'</h3></div><button class="ax" onclick="clearWs()">×</button></div><p class="adesc">'+a.desc+' · <span class="askill">'+a.skill+'</span></p>'+f+'<div class="prev"><div class="plabel">Ready-to-run prompt</div><div class="ptext" id="ptext"></div></div><div class="arow"><button class="btn primary" onclick="copyCur()">Copy prompt</button><button class="btn ghost" onclick="clearWs()">Close</button></div><div class="ahint"><b>To run it &rarr;</b> ① tap <b>Copy prompt</b> &nbsp;② open a <b>new chat in Claude</b> &nbsp;③ paste it in and send — I\'ll do the work and hand back the result.</div></div>';
  document.querySelectorAll('#workspace [data-k]').forEach(el=>el.addEventListener('input',upd));
  document.getElementById('wscount').textContent='1 artifact';
  upd();
}
function vals(){const v={};document.querySelectorAll('#workspace [data-k]').forEach(el=>{const raw=(el.value||'').trim();const fd=current.a.fields[el.dataset.k];v[el.dataset.k]=raw||('['+((fd&&fd.label)||el.dataset.k)+']');});return v;}
function upd(){if(!current)return;document.getElementById('ptext').textContent=current.a.template(vals());}
function copyCur(){const t=current.a.template(vals());const d=()=>toast();if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(d).catch(()=>fb(t,d));else fb(t,d);}
function fb(t,cb){const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity=0;document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(e){}document.body.removeChild(ta);cb&&cb();}
function toast(){const t=document.getElementById('toast');t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1600);}
function clearWs(){current=null;document.getElementById('wscount').textContent='0 artifacts';document.getElementById('workspace').innerHTML=emptyWs();wireEmpty();}
function greet(){return CONFIG.ownerName?('Hello, '+CONFIG.ownerName):'Your AI Workspace';}
function howtoBody(){
  return '<div class="wshow">'
    +'<span class="live"><span class="d"></span>Connected to your live EIQ tenant</span>'
    +'<div class="wsteps">'
      +'<div class="wstep"><span class="wsnum">1</span><div><b>Pick a command</b> on the left — a builder opens here and fills in a tailored prompt.</div></div>'
      +'<div class="wstep"><span class="wsnum">2</span><div><b>Copy the prompt</b> and open a <b>new chat in Claude</b>.</div></div>'
      +'<div class="wstep"><span class="wsnum">3</span><div><b>Paste it and send.</b> Claude runs it against your live EIQ — pulling real data and, where you ask, <b>drafting and creating</b> right in your modules.</div></div>'
    +'</div>'
    +'<div class="wsnote"><b>Connected LIVE to your EIQ tenant.</b> Claude can read your CRM, inbox, accounting and more, and <b>create or update</b> real items — a newsletter into the newsletter module, an email campaign as a draft, a task, a doc in EvolveDocs. Anything that would <b>send, publish or spend is left as a draft for you to approve</b> — never fired off on its own.</div>'
    +'<div class="wstablabel">Safe by default</div>'
    +'<div class="wstabs">'
      +'<div class="wstab"><span class="k">Drafts wait</span><div>Nothing publishes itself — every draft waits for your yes or no.</div></div>'
      +'<div class="wstab"><span class="k">Ads paused</span><div>Ad creative is built and uploaded <b>paused</b> — not a cent spends until you press go.</div></div>'
      +'<div class="wstab"><span class="k">Email never auto-sends</span><div>It lands as a draft in your email tool. You press send.</div></div>'
      +'<div class="wstab"><span class="k">Never invents a fact</span><div>If it isn&rsquo;t sure of something it writes PLACEHOLDER and asks — no made-up numbers.</div></div>'
    +'</div>'
    +'<div class="wstablabel">Get more out of it</div>'
    +'<div class="wstabs">'
      +'<div class="wstab"><span class="k">10-80-10</span><div>You brief it (first 10%), it does the work (80%), you approve (last 10%). The two tens are the parts that needed a human anyway.</div></div>'
      +'<div class="wstab"><span class="k">Talk, don&rsquo;t type</span><div>Speak your request instead of typing — the rambling gives it about 3&times; the context, and more context in means better work out.</div></div>'
      +'<div class="wstab"><span class="k">Fix the process</span><div>Don&rsquo;t fix the draft — say what you changed and update the skill, so the next one is right before you look at it. (See the <b>Train &amp; Improve</b> commands.)</div></div>'
      +'<div class="wstab"><span class="k">Build smart, run cheap</span><div>Use the smart model to build or rewrite a skill; run everyday output on the fast one. The thinking is worth paying for, the typing isn&rsquo;t.</div></div>'
    +'</div>'
    +'<div class="wstablabel">What each tab is for</div>'
    +'<div class="wstabs">'
      +'<div class="wstab"><span class="k">Workflows</span><div>Ready-made tasks across your business — each opens a builder that writes the prompt for you.</div></div>'
      +'<div class="wstab"><span class="k">Skills</span><div>The specialist abilities Claude brings to a job — brand voice, de-slop editing, buyer analysis and more.</div></div>'
      +'<div class="wstab"><span class="k">EIQ Connector</span><div>Your live EIQ modules — CRM, accounting, inbox, newsletter, EvolveDocs, pages, SQL — that Claude can read and write.</div></div>'
      +'<div class="wstab"><span class="k">Personas</span><div>The EIQ VA personas from your skill library that Claude can adopt for a task.</div></div>'
    +'</div>'
    +'<div class="wstablabel">EIQ Connector — setup &amp; help</div>'
    +'<div class="wstabs">'
      +'<div class="wstab"><span class="k">Connect</span><div>Settings &rarr; Connectors &rarr; add <b>EIQ Manager</b> and approve the sign-in (evolvepreneuriq.app). One connector per business — no keys to paste.</div></div>'
      +'<div class="wstab"><span class="k">Reconnect</span><div>If the Connector, Personas or data tabs come back empty, re-authorise <b>EIQ Manager</b> in Settings &rarr; Connectors.</div></div>'
      +'<div class="wstab"><span class="k">Add a business</span><div>Add another EIQ Manager connector, then rebuild — it appears in the switcher and in the Business field on every command.</div></div>'
      +'<div class="wstab"><span class="k">Refresh</span><div>After connecting, reconnecting or updating, say <b>&ldquo;rebuild my console&rdquo;</b> to pull the latest data and tools.</div></div>'
    +'</div>'
  +'</div>';
}
function openHelp(){
  let m=document.getElementById('hmodal');
  if(!m){m=document.createElement('div');m.id='hmodal';m.className='hmodal';document.body.appendChild(m);m.onclick=e=>{if(e.target===m)closeHelp();};}
  m.innerHTML='<div class="hcard"><button class="hx" onclick="closeHelp()">×</button><h3>How Evolvepreneur®iQ Workplace works</h3><p class="hsub">Pick a command, run it in Claude, and it works against your live EIQ.</p>'+howtoBody()+'<div class="hlinks"><a href="'+CONFIG.site+'" target="_blank" rel="noopener">Open Evolvepreneur&reg;iQ &#8599;</a><span>&middot;</span><span>Updates install automatically \u2014 you\'re on v'+CONFIG.version+'</span></div><div class="harow"><button class="btn primary" onclick="closeHelp()">Got it</button></div></div>';
  m.classList.add('show');
  wireEmpty();
}
function closeHelp(){const m=document.getElementById('hmodal');if(m)m.classList.remove('show');}
function emptyWs(){
  const chips=CHIPS.map(c=>'<span data-jm="'+c[1]+'" data-jid="'+c[2]+'">'+c[0]+'</span>').join('');
  return '<div class="wsempty">'
    +'<div class="wssparkle">✦</div>'
    +'<h2>'+greet()+'</h2>'
    +'<p>'+(CONFIG.ownerName?'This is your AI workspace. ':'')+'Every command here builds a ready-to-run prompt. You run it in Claude, and Claude does the work against your account.</p>'
    +howtoBody()
    +'<div class="wslabel">Quick start</div>'
    +'<div class="wschips">'+chips+'</div>'
  +'</div>';
}
function wireEmpty(){document.querySelectorAll('.wschips [data-jm]').forEach(s=>{s.style.cursor='pointer';s.onclick=()=>jump(s.dataset.jm,s.dataset.jid);});}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{mode=t.dataset.mode;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===t));renderMenu();});
document.getElementById('search').addEventListener('input',e=>{query=e.target.value;renderMenu();});
/* apply CONFIG — business name + top-bar shortcuts into the platform (generic URLs) */
function applyConfig(){
  document.getElementById('bizName').innerHTML=BRAND;
  document.getElementById('asstName').textContent=CONFIG.businessName;
  document.getElementById('userAvatar').textContent=((CONFIG.ownerName||CONFIG.businessName||'?').trim().charAt(0)||'·').toUpperCase();
  document.getElementById('tenant').innerHTML=CONFIG.businessName+' &#9662;';
  const nav=document.getElementById('tnav'); nav.innerHTML='';
  CONFIG.sections.forEach(([label,path])=>{const s=document.createElement('span');s.textContent=label;s.style.cursor='pointer';s.title='Open in '+CONFIG.site.replace(/^https?:\/\//,'');s.onclick=()=>openSite(path);nav.appendChild(s);});
  const t=document.getElementById('tenant');t.style.cursor='pointer';t.onclick=e=>{e.stopPropagation();bizMenu();};
  const bh=document.getElementById('brandHome');bh.style.cursor='pointer';bh.onclick=()=>openSite('workspace');
}
function setBiz(b){activeBiz=b;CONFIG.businessName=b;document.getElementById('tenant').innerHTML=b+' &#9662;';document.getElementById('asstName').textContent=b;if(!current){document.getElementById('workspace').innerHTML=emptyWs();wireEmpty();}}
function bizMenu(){
  const ex=document.getElementById('bizmenu');if(ex){ex.remove();return;}
  const m=document.createElement('div');m.id='bizmenu';m.className='bizmenu';
  m.innerHTML=CONFIG.businesses.map(b=>'<div class="bizitem'+(b===activeBiz?' on':'')+'" data-b="'+String(b).replace(/"/g,'&quot;')+'">'+b+'</div>').join('')
    +(CONFIG.businesses.length>1?'':'<div class="bizhint">One business connected — the console shows it. Connect more EIQ tenants to switch here.</div>');
  document.querySelector('.tr').appendChild(m);
  m.querySelectorAll('.bizitem').forEach(it=>it.onclick=()=>{setBiz(it.dataset.b);m.remove();document.removeEventListener('click',closeBiz);});
  setTimeout(()=>document.addEventListener('click',closeBiz),0);
}
function closeBiz(e){const m=document.getElementById('bizmenu');if(m&&!m.contains(e.target)){m.remove();document.removeEventListener('click',closeBiz);}}
applyConfig();
document.getElementById('themeBtn').onclick=function(){var d=document.documentElement;var dark=d.getAttribute('data-theme')==='dark';d.setAttribute('data-theme',dark?'':'dark');this.innerHTML=dark?'&#9790;':'&#9728;';this.title=dark?'Dark mode':'Light mode';};
function cmpVer(a,b){var A=String(a).split('.').map(Number),B=String(b).split('.').map(Number);for(var i=0;i<3;i++){if((A[i]||0)>(B[i]||0))return 1;if((A[i]||0)<(B[i]||0))return -1;}return 0;}
(function(){
  var cur=CONFIG.version, el=document.getElementById('verInfo'), url=CONFIG.updatesUrl||CONFIG.site;
  el.innerHTML='<a href="'+url+'" target="_blank" rel="noopener" title="You&rsquo;re on v'+cur+' — click for updates">&#8635; v'+cur+'</a>';
  if(!CONFIG.updatesFeed) return;
  try{
    fetch(CONFIG.updatesFeed,{cache:'no-store'}).then(function(r){return r.ok?r.json():null;}).then(function(j){
      if(j&&j.version&&cmpVer(j.version,cur)>0){
        el.innerHTML='<a href="'+url+'" target="_blank" rel="noopener" style="color:#f59e0b;font-weight:700" title="'+((j.notes||'A newer version is available').replace(/"/g,"&quot;"))+'">&#8593; Update available · v'+j.version+'</a>';
      }
    }).catch(function(){});
  }catch(e){}
})();
document.getElementById('helpBtn').onclick=openHelp;
document.getElementById('workspace').innerHTML=emptyWs();wireEmpty();
renderMenu();

</script></body></html>
